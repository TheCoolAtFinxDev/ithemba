<div style="min-height:100vh;background:#f5f7fb;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="max-width:400px;width:100%;text-align:center">

    <!-- Icon -->
    <div style="width:88px;height:88px;background:#fdecea;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
      <i class="bi bi-shield-exclamation" style="font-size:40px;color:#E53935"></i>
    </div>

    <!-- Heading -->
    <h3 style="font-weight:700;margin-bottom:8px;color:#1a1a2e">Access Denied</h3>
    <p style="color:#6c757d;font-size:15px;margin-bottom:32px;line-height:1.6">
      You don't have permission to view this page.<br>
      Please contact your administrator if you believe this is a mistake.
    </p>

    <!-- Actions -->
    <div class="d-flex flex-column gap-3">
      <button
        class="btn btn-ith-primary"
        style="padding:14px;font-size:15px;font-weight:600;border-radius:12px"
        (click)="goHome()">
        <i class="bi bi-house me-2"></i>Go to My Dashboard
      </button>
      <button
        class="btn btn-outline-secondary"
        style="padding:12px;font-size:14px;border-radius:12px"
        (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>Sign Out
      </button>
    </div>

    <!-- Brand -->
    <div class="d-flex align-items-center justify-content-center gap-2 mt-5">
      <div style="width:28px;height:28px;background:linear-gradient(135deg,#00B9D6,#4A7C59);border-radius:8px;display:flex;align-items:center;justify-content:center">
        <i class="bi bi-heart-pulse-fill text-white" style="font-size:12px"></i>
      </div>
      <span style="font-weight:700;font-size:15px;color:#2d2d2d">iThemba</span>
    </div>

  </div>
</div>

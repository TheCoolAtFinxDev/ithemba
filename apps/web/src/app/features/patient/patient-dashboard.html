<!-- Bottom nav layout — mobile first like the screenshots -->
<div style="min-height:100vh;background:#f5f7fb;padding-bottom:72px">

  <!-- Header -->
  <div class="ith-navbar px-4 d-flex align-items-center justify-content-between" style="position:sticky;top:0;z-index:100">
    <i class="bi bi-list" style="font-size:24px;cursor:pointer"></i>
    <div style="width:36px;height:36px;background:#4A7C59;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <i class="bi bi-heart-pulse-fill text-white" style="font-size:16px"></i>
    </div>
    <i class="bi bi-person-circle" style="font-size:24px;cursor:pointer" (click)="logout()"></i>
  </div>

  <!-- Content -->
  <div class="container py-4">
    <h5 style="font-weight:700">Welcome back, {{userName}}</h5>
    <p class="text-muted">Here's your health savings overview</p>

    <!-- HSA Balance Card -->
    <div class="ith-card p-4 mb-4" style="background:linear-gradient(135deg,#00B9D6,#4A7C59);color:#fff">
      <div class="text-white-50 mb-1" style="font-size:13px">HSA Balance</div>
      <div style="font-size:36px;font-weight:700">R 0.00</div>
      <div class="d-flex gap-3 mt-3">
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border-radius:8px">
          <i class="bi bi-plus-circle me-1"></i>Top Up
        </button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border-radius:8px">
          <i class="bi bi-clock-history me-1"></i>History
        </button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-3 mb-4">
      <div class="col-6">
        <div class="ith-card p-3 text-center" style="cursor:pointer">
          <i class="bi bi-search" style="font-size:28px;color:#00B9D6"></i>
          <div style="font-size:13px;font-weight:600;margin-top:8px">Find Doctor</div>
        </div>
      </div>
      <div class="col-6">
        <div class="ith-card p-3 text-center" style="cursor:pointer">
          <i class="bi bi-calendar-plus" style="font-size:28px;color:#4A7C59"></i>
          <div style="font-size:13px;font-weight:600;margin-top:8px">Book Appointment</div>
        </div>
      </div>
      <div class="col-6">
        <div class="ith-card p-3 text-center" style="cursor:pointer">
          <i class="bi bi-people" style="font-size:28px;color:#FF9800"></i>
          <div style="font-size:13px;font-weight:600;margin-top:8px">Beneficiaries</div>
        </div>
      </div>
      <div class="col-6">
        <div class="ith-card p-3 text-center" style="cursor:pointer">
          <i class="bi bi-file-text" style="font-size:28px;color:#9C27B0"></i>
          <div style="font-size:13px;font-weight:600;margin-top:8px">My Claims</div>
        </div>
      </div>
    </div>

    <!-- Upcoming appointments -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 style="font-weight:700;margin:0">Upcoming Appointments</h6>
      <a href="#" class="text-decoration-none" style="color:#00B9D6;font-size:13px">View all</a>
    </div>
    <div class="ith-card p-4 text-center text-muted">
      <i class="bi bi-calendar-x" style="font-size:32px;opacity:0.3"></i>
      <p class="mt-2 mb-0" style="font-size:14px">No upcoming appointments</p>
    </div>
  </div>
</div>

<!-- Bottom Navigation — matching screenshots -->
<nav style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;height:64px;display:flex;z-index:200">
  <a style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#00B9D6;font-size:11px;gap:4px">
    <i class="bi bi-house-fill" style="font-size:20px"></i>
    Home
  </a>
  <a style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#9e9e9e;font-size:11px;gap:4px">
    <i class="bi bi-calendar3" style="font-size:20px"></i>
    Appointments
  </a>
  <a style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#9e9e9e;font-size:11px;gap:4px">
    <i class="bi bi-file-medical" style="font-size:20px"></i>
    Claims
  </a>
</nav>

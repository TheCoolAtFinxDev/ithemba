<div style="min-height:100vh;background:#f5f7fb;padding-bottom:72px">

  <!-- ── HOME VIEW ─────────────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'home'">

    <!-- Header -->
    <div class="ith-navbar px-4 d-flex align-items-center justify-content-between" style="position:sticky;top:0;z-index:100">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,#00B9D6,#4A7C59);border-radius:50%;display:flex;align-items:center;justify-content:center">
        <i class="bi bi-heart-pulse-fill text-white" style="font-size:16px"></i>
      </div>
      <span style="font-weight:700;font-size:15px">iThemba</span>
      <i class="bi bi-person-circle" style="font-size:24px;cursor:pointer;color:#2d2d2d" (click)="logout()"></i>
    </div>

    <div class="container py-4">
      <h5 style="font-weight:700">Welcome back, {{ userName }}</h5>
      <p class="text-muted" style="font-size:13px">Here's your health savings overview</p>

      <!-- HSA Balance Card -->
      <div class="ith-card p-4 mb-4" style="background:linear-gradient(135deg,#00B9D6,#4A7C59);color:#fff;cursor:pointer" (click)="activeView='wallet'">
        <div style="font-size:12px;opacity:0.8;margin-bottom:4px">HSA Balance</div>
        <div style="font-size:36px;font-weight:700">
          <span *ngIf="walletBalance !== null">R {{ walletBalance | number:'1.2-2' }}</span>
          <span *ngIf="walletBalance === null" class="placeholder-glow"><span class="placeholder col-4"></span></span>
        </div>
        <div class="d-flex gap-3 mt-3">
          <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border-radius:8px;font-size:13px" (click)="$event.stopPropagation(); activeView='wallet'">
            <i class="bi bi-plus-circle me-1"></i>Top Up
          </button>
          <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border-radius:8px;font-size:13px" (click)="$event.stopPropagation(); activeView='wallet'">
            <i class="bi bi-clock-history me-1"></i>History
          </button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="row g-3 mb-4">
        <div class="col-6">
          <div class="ith-card p-3 text-center quick-action" (click)="openBook()">
            <i class="bi bi-search" style="font-size:28px;color:#00B9D6"></i>
            <div style="font-size:13px;font-weight:600;margin-top:8px">Find Doctor</div>
          </div>
        </div>
        <div class="col-6">
          <div class="ith-card p-3 text-center quick-action" (click)="goToAppointments()">
            <i class="bi bi-calendar3" style="font-size:28px;color:#4A7C59"></i>
            <div style="font-size:13px;font-weight:600;margin-top:8px">Appointments</div>
          </div>
        </div>
        <div class="col-6">
          <div class="ith-card p-3 text-center quick-action">
            <i class="bi bi-people" style="font-size:28px;color:#FF9800"></i>
            <div style="font-size:13px;font-weight:600;margin-top:8px">Beneficiaries</div>
          </div>
        </div>
        <div class="col-6">
          <div class="ith-card p-3 text-center quick-action" (click)="activeView='claims'">
            <i class="bi bi-file-medical" style="font-size:28px;color:#9C27B0"></i>
            <div style="font-size:13px;font-weight:600;margin-top:8px">My Claims</div>
          </div>
        </div>
      </div>

      <!-- Upcoming appointments preview -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 style="font-weight:700;margin:0">Upcoming Appointments</h6>
        <a style="color:#00B9D6;font-size:13px;cursor:pointer;text-decoration:none" (click)="goToAppointments()">View all</a>
      </div>
      <div class="ith-card p-4 text-center text-muted">
        <i class="bi bi-calendar-x" style="font-size:32px;opacity:0.3"></i>
        <p class="mt-2 mb-2" style="font-size:14px">Book your first appointment</p>
        <button class="btn btn-ith-primary btn-sm" (click)="openBook()">
          <i class="bi bi-search me-1"></i>Find a Doctor
        </button>
      </div>
    </div>

  </ng-container>

  <!-- ── APPOINTMENTS LIST ──────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'appointments'">
    <app-patient-appointments
      (openDetail)="openDetail($event)"
      (openBook)="openBook()">
    </app-patient-appointments>
  </ng-container>

  <!-- ── APPOINTMENT DETAIL ─────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'appointment-detail'">
    <app-patient-appointment-detail
      [appointmentId]="selectedAppointmentId"
      (back)="backToAppointments()"
      (reschedule)="openReschedule($event)">
    </app-patient-appointment-detail>
  </ng-container>

  <!-- ── BOOK / RESCHEDULE ──────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'book'">
    <app-patient-book
      [rescheduleApptId]="rescheduleApptId"
      [preselectedProviderId]="preselectedProviderId"
      (done)="onBookDone()"
      (back)="backToAppointments()">
    </app-patient-book>
  </ng-container>

  <!-- ── WALLET ────────────────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'wallet'">
    <app-patient-wallet (back)="activeView = 'home'; loadWalletBalance()">
    </app-patient-wallet>
  </ng-container>

  <!-- ── CLAIMS ─────────────────────────────────────────────────────── -->
  <ng-container *ngIf="activeView === 'claims'">
    <app-patient-claims (back)="setTab('home')">
    </app-patient-claims>
  </ng-container>

</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a class="nav-item" [class.active]="activeTab === 'home'" (click)="setTab('home')">
    <i class="bi" [class.bi-house-fill]="activeTab === 'home'" [class.bi-house]="activeTab !== 'home'"></i>
    Home
  </a>
  <a class="nav-item" [class.active]="activeTab === 'appointments'" (click)="setTab('appointments')">
    <i class="bi" [class.bi-calendar-fill]="activeTab === 'appointments'" [class.bi-calendar3]="activeTab !== 'appointments'"></i>
    Appointments
  </a>
  <a class="nav-item" [class.active]="activeView === 'claims'" (click)="activeView='claims'; activeTab='claims'">
    <i class="bi" [class.bi-file-medical-fill]="activeView === 'claims'" [class.bi-file-medical]="activeView !== 'claims'"></i>
    Claims
  </a>
</nav>

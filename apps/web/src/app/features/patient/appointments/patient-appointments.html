<!-- Header -->
<div class="ith-section-header px-4 py-3 d-flex align-items-center justify-content-between">
  <h6 class="mb-0 fw-bold">My Appointments</h6>
  <button class="btn-icon" (click)="refresh()" title="Refresh">
    <i class="bi bi-arrow-clockwise" style="font-size:18px;color:#00B9D6"></i>
  </button>
</div>

<!-- Book button -->
<div class="px-3 pt-3">
  <button class="btn btn-ith-primary w-100" (click)="openBook.emit()">
    <i class="bi bi-calendar-plus me-2"></i>Book New Appointment
  </button>
</div>

<!-- Tabs -->
<div class="tabs-row px-3 mt-3">
  <button class="tab-btn" [class.active]="tab === 'upcoming'" (click)="setTab('upcoming')">Upcoming</button>
  <button class="tab-btn" [class.active]="tab === 'past'" (click)="setTab('past')">Past</button>
</div>

<!-- Error -->
<div *ngIf="error" class="alert alert-danger mx-3 mt-3 py-2 px-3" style="font-size:13px;border-radius:10px">
  {{ error }}
</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center py-5 text-muted">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Empty state -->
<div *ngIf="!loading && list.length === 0" class="text-center py-5 text-muted px-4">
  <i class="bi bi-calendar-x" style="font-size:48px;opacity:0.25"></i>
  <p class="mt-3 mb-0" style="font-size:14px">
    {{ tab === 'upcoming' ? 'No upcoming appointments' : 'No past appointments' }}
  </p>
</div>

<!-- List -->
<div class="px-3 mt-2 pb-5">
  <div *ngFor="let a of list"
       class="ith-card p-3 mb-3 appt-card"
       (click)="openDetail.emit(a.id)">
    <div class="d-flex justify-content-between align-items-start mb-1">
      <span style="font-weight:700;font-size:14px">{{ a.label }}</span>
      <span class="status-badge {{ a.statusSlug }}">{{ a.statusText }}</span>
    </div>
    <div style="font-size:13px;color:#555">{{ a.clinic }}</div>
    <div style="font-size:13px;color:#555">Dr {{ a.doctor }}</div>
    <div style="font-size:12px;color:#9e9e9e;margin-top:4px">
      <i class="bi bi-calendar3 me-1"></i>{{ a.dateLabel }}
    </div>
    <div style="font-size:12px;color:#9e9e9e;margin-top:2px">
      <i class="bi bi-chevron-right" style="float:right;color:#ccc"></i>
    </div>
  </div>
</div>

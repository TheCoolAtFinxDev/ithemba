<div>

  <!-- ── Profile details ───────────────────────────────────────── -->
  <div class="ith-card p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0">Profile Details</h6>
      <span *ngIf="profile?.isVerified" style="font-size:12px;font-weight:600;color:#2E7D32">
        <i class="bi bi-patch-check-fill me-1"></i>Verified
      </span>
      <span *ngIf="profile && !profile.isVerified" style="font-size:12px;font-weight:600;color:#FF9800">
        <i class="bi bi-clock me-1"></i>Pending Verification
      </span>
    </div>

    <div *ngIf="profileLoading" class="text-center py-4">
      <div class="spinner-border spinner-border-sm" style="color:#4A7C59"></div>
    </div>

    <div *ngIf="!profileLoading && profile">
      <div *ngIf="profileSuccess" class="alert alert-success py-2 px-3 mb-3" style="font-size:13px;border-radius:10px">{{ profileSuccess }}</div>
      <div *ngIf="profileError" class="alert alert-danger py-2 px-3 mb-3" style="font-size:13px;border-radius:10px">{{ profileError }}</div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">First Name</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.firstName" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">Last Name</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.lastName" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">Clinic Name</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.clinicName" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">Specialization</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.specialization" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">Phone Number</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.phoneNumber" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold" style="font-size:13px">Location / Address</label>
          <input class="form-control" style="border-radius:10px" [(ngModel)]="profile.location" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold" style="font-size:13px">About / Bio</label>
          <textarea class="form-control" style="border-radius:10px;font-size:13px" rows="3"
                    [(ngModel)]="profile.about" placeholder="Brief description of your practice…"></textarea>
        </div>
      </div>

      <button class="btn btn-ith-primary mt-4" [disabled]="profileSaving" (click)="saveProfile()">
        <span *ngIf="profileSaving" class="spinner-border spinner-border-sm me-2"></span>
        {{ profileSaving ? 'Saving…' : 'Save Profile' }}
      </button>
    </div>
  </div>

  <!-- ── Working Hours ─────────────────────────────────────────── -->
  <div class="ith-card p-4">
    <h6 class="fw-bold mb-3">Working Hours</h6>

    <div *ngIf="hoursLoading" class="text-center py-4">
      <div class="spinner-border spinner-border-sm" style="color:#4A7C59"></div>
    </div>

    <div *ngIf="!hoursLoading && hours.length > 0">
      <div *ngIf="hoursSuccess" class="alert alert-success py-2 px-3 mb-3" style="font-size:13px;border-radius:10px">{{ hoursSuccess }}</div>
      <div *ngIf="hoursError" class="alert alert-danger py-2 px-3 mb-3" style="font-size:13px;border-radius:10px">{{ hoursError }}</div>

      <div *ngFor="let h of hours" class="hours-row">
        <div class="hours-row__day">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch"
                   [id]="'day-' + h.dayOfWeek" [(ngModel)]="h.isAvailable" />
          </div>
          <label [for]="'day-' + h.dayOfWeek"
                 style="font-size:14px;cursor:pointer"
                 [style.fontWeight]="h.isAvailable ? '600' : '400'"
                 [style.color]="h.isAvailable ? '#1a1a2e' : '#9e9e9e'">
            {{ h.dayName }}
          </label>
        </div>
        <div *ngIf="h.isAvailable" class="d-flex align-items-center gap-2">
          <input type="time" class="form-control form-control-sm time-input"
                 [(ngModel)]="h.startTime" />
          <span style="color:#9e9e9e;font-size:13px">to</span>
          <input type="time" class="form-control form-control-sm time-input"
                 [(ngModel)]="h.endTime" />
        </div>
        <div *ngIf="!h.isAvailable" style="font-size:13px;color:#9e9e9e;font-style:italic">Closed</div>
      </div>

      <button class="btn btn-ith-primary mt-4" [disabled]="hoursSaving" (click)="saveHours()">
        <span *ngIf="hoursSaving" class="spinner-border spinner-border-sm me-2"></span>
        {{ hoursSaving ? 'Saving…' : 'Save Hours' }}
      </button>
    </div>
  </div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h5 class="fw-bold mb-1">Users</h5>
    <p class="text-muted mb-0" style="font-size:13px">{{ users.length }} total</p>
  </div>
  <div class="position-relative" style="width:260px">
    <i class="bi bi-search position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:#9e9e9e;font-size:14px"></i>
    <input class="form-control" style="padding-left:36px;border-radius:10px;font-size:13px;border-color:#e0e0e0"
           placeholder="Search name or email…"
           [(ngModel)]="search" (ngModelChange)="onSearch()" />
  </div>
</div>

<div *ngIf="actionError" class="alert alert-danger py-2 px-3 mb-3" style="font-size:13px;border-radius:10px">{{ actionError }}</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<div *ngIf="!loading && users.length === 0" class="text-center py-5 text-muted">
  <i class="bi bi-person-x" style="font-size:40px;opacity:0.3"></i>
  <p class="mt-3" style="font-size:14px">No users found</p>
</div>

<div *ngIf="!loading && users.length > 0" class="ith-card overflow-hidden">
  <div class="table-responsive">
    <table class="table table-hover mb-0" style="font-size:13px">
      <thead style="background:#f9fafc;border-bottom:2px solid #f0f0f0">
        <tr>
          <th class="px-4 py-3 fw-semibold" style="color:#555;border:none">Name / Email</th>
          <th class="px-3 py-3 fw-semibold" style="color:#555;border:none">Role</th>
          <th class="px-3 py-3 fw-semibold" style="color:#555;border:none">Type</th>
          <th class="px-3 py-3 fw-semibold" style="color:#555;border:none">Status</th>
          <th class="px-3 py-3 fw-semibold" style="color:#555;border:none">Joined</th>
          <th class="px-3 py-3 fw-semibold" style="color:#555;border:none">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users" style="border-color:#f5f5f5">
          <td class="px-4 py-3" style="border:none">
            <div style="font-weight:600;color:#1a1a2e">{{ u.fullName }}</div>
            <div style="color:#9e9e9e;font-size:12px">{{ u.email }}</div>
          </td>
          <td class="px-3 py-3" style="border:none">
            <span class="role-badge" [ngClass]="'role-' + primaryRole(u).toLowerCase()">{{ primaryRole(u) }}</span>
          </td>
          <td class="px-3 py-3" style="border:none;color:#555">
            <span *ngIf="u.patient">Patient</span>
            <span *ngIf="u.provider">
              Provider
              <span *ngIf="!u.provider.isVerified" class="ms-1" style="color:#FF9800;font-size:11px;font-weight:600">• Unverified</span>
              <span *ngIf="u.provider.isVerified" class="ms-1" style="color:#4A7C59;font-size:11px;font-weight:600">• Verified</span>
            </span>
            <span *ngIf="!u.patient && !u.provider" style="color:#9e9e9e">—</span>
          </td>
          <td class="px-3 py-3" style="border:none">
            <span *ngIf="!isLocked(u)" style="color:#2E7D32;font-size:12px;font-weight:600">
              <i class="bi bi-check-circle-fill me-1"></i>Active
            </span>
            <span *ngIf="isLocked(u)" style="color:#B71C1C;font-size:12px;font-weight:600">
              <i class="bi bi-lock-fill me-1"></i>Locked
            </span>
          </td>
          <td class="px-3 py-3 text-muted" style="border:none;font-size:12px">{{ formatDate(u.createdAt) }}</td>
          <td class="px-3 py-3" style="border:none">
            <div class="d-flex gap-1 flex-wrap">
              <!-- Lock/Unlock -->
              <button class="btn btn-sm"
                      [disabled]="actionLoading && actionUserId === u.id"
                      [style.background]="isLocked(u) ? '#E8F5E9' : '#FFEBEE'"
                      [style.color]="isLocked(u) ? '#2E7D32' : '#B71C1C'"
                      style="border:none;border-radius:6px;font-size:11px;font-weight:600;padding:4px 8px"
                      (click)="toggleLock(u)">
                <span *ngIf="actionLoading && actionUserId === u.id" class="spinner-border spinner-border-sm me-1" style="width:10px;height:10px"></span>
                <i *ngIf="!(actionLoading && actionUserId === u.id)" class="bi me-1" [class.bi-unlock]="isLocked(u)" [class.bi-lock]="!isLocked(u)"></i>
                {{ isLocked(u) ? 'Unlock' : 'Lock' }}
              </button>
              <!-- Assign Role -->
              <button class="btn btn-sm" style="background:#E3F2FD;color:#1565C0;border:none;border-radius:6px;font-size:11px;font-weight:600;padding:4px 8px"
                      (click)="openRoleModal(u)">
                <i class="bi bi-person-badge me-1"></i>Role
              </button>
              <!-- Verify Provider -->
              <button *ngIf="u.provider && !u.provider.isVerified"
                      class="btn btn-sm" style="background:#E8F5E9;color:#2E7D32;border:none;border-radius:6px;font-size:11px;font-weight:600;padding:4px 8px"
                      (click)="verifyProvider(u)">
                <i class="bi bi-patch-check me-1"></i>Verify
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Role modal -->
<div *ngIf="showRoleModal" class="modal-overlay" (click)="closeRoleModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0">Assign Role</h6>
      <button class="btn-icon" (click)="closeRoleModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <label class="form-label fw-semibold" style="font-size:13px">Select Role</label>
    <select class="form-select mb-4" style="border-radius:10px" [(ngModel)]="selectedRole">
      <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
    </select>
    <button class="btn btn-ith-primary w-100" [disabled]="actionLoading" (click)="assignRole()">
      <span *ngIf="actionLoading" class="spinner-border spinner-border-sm me-2"></span>
      Assign Role
    </button>
  </div>
</div>

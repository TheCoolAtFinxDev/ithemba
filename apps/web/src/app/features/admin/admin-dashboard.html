<div class="d-flex" style="min-height:100vh">

  <!-- Sidebar -->
  <div class="ith-sidebar d-flex flex-column p-3">
    <div class="d-flex align-items-center gap-2 mb-4 px-2 pt-2">
      <div style="width:32px;height:32px;background:#4A7C59;border-radius:50%;display:flex;align-items:center;justify-content:center">
        <i class="bi bi-heart-pulse-fill text-white" style="font-size:14px"></i>
      </div>
      <span style="font-weight:700;color:#2d2d2d">iThemba Admin</span>
    </div>
    <div class="text-muted px-2 mb-2" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">Main Menu</div>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3" style="background:#e8f8fb;color:#00B9D6;font-weight:500">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3 text-muted">
      <i class="bi bi-people"></i> Users
    </a>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3 text-muted">
      <i class="bi bi-hospital"></i> Providers
    </a>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3 text-muted">
      <i class="bi bi-file-medical"></i> Claims
    </a>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3 text-muted">
      <i class="bi bi-shield-lock"></i> Roles & Permissions
    </a>
    <a class="d-flex align-items-center gap-3 px-3 py-2 mb-1 text-decoration-none rounded-3 text-muted">
      <i class="bi bi-bar-chart"></i> Reports
    </a>
    <div class="mt-auto">
      <a class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none rounded-3 text-muted" style="cursor:pointer" (click)="logout()">
        <i class="bi bi-box-arrow-left"></i> Logout
      </a>
    </div>
  </div>

  <!-- Main content -->
  <div style="margin-left:260px;flex:1;background:#f5f7fb">
    <!-- Topbar -->
    <div class="ith-navbar px-4 d-flex align-items-center justify-content-between">
      <h6 style="margin:0;font-weight:700">Admin Dashboard</h6>
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-bell" style="font-size:20px;color:#9e9e9e"></i>
        <div style="width:36px;height:36px;background:#E53935;border-radius:50%;display:flex;align-items:center;justify-content:center">
          <i class="bi bi-person-fill text-white"></i>
        </div>
      </div>
    </div>

    <!-- Dashboard content -->
    <div class="p-4">
      <h5 style="font-weight:700">Welcome, {{userName}}</h5>
      <p class="text-muted">Platform overview</p>

      <!-- Stats -->
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="ith-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="text-muted" style="font-size:13px">Total Users</span>
              <i class="bi bi-people" style="color:#00B9D6;font-size:20px"></i>
            </div>
            <div style="font-size:32px;font-weight:700">0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="ith-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="text-muted" style="font-size:13px">Active Providers</span>
              <i class="bi bi-hospital" style="color:#4A7C59;font-size:20px"></i>
            </div>
            <div style="font-size:32px;font-weight:700">0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="ith-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="text-muted" style="font-size:13px">Pending Claims</span>
              <i class="bi bi-file-earmark-text" style="color:#FF9800;font-size:20px"></i>
            </div>
            <div style="font-size:32px;font-weight:700">0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="ith-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="text-muted" style="font-size:13px">Total HSA Funds</span>
              <i class="bi bi-wallet2" style="color:#9C27B0;font-size:20px"></i>
            </div>
            <div style="font-size:32px;font-weight:700">R 0</div>
          </div>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="ith-card p-4">
        <h6 style="font-weight:700;margin-bottom:16px">Recent Activity</h6>
        <div class="text-center text-muted py-4">
          <i class="bi bi-activity" style="font-size:32px;opacity:0.3"></i>
          <p class="mt-2 mb-0" style="font-size:14px">No recent activity</p>
        </div>
      </div>
    </div>
  </div>
</div>
